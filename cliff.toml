# Release notes for a `vX.Y.Z` tag, built from the Conventional Commit subjects since the previous
# tag (.github/workflows/release.yml). Preview before tagging:
#   uvx git-cliff --unreleased --tag vX.Y.Z --strip all

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope and commit.scope != "deps" %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
{% if previous.version %}
**Full changelog**: https://github.com/{{ get_env(name="GITHUB_REPOSITORY", default="bivri/dazzle") }}/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^build\\(deps\\)", group = "<!-- 5 -->Dependencies" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^test", group = "<!-- 7 -->Tests" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
